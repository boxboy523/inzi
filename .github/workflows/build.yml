name: "Windows EXE Build"

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust 32-bit target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: i686-pc-windows-msvc

      - name: Check libs folder
        run: |
          if (Test-Path "src-tauri/lib/Fwlib64.lib") { echo "Library found!" } else { echo "Library NOT found!"; exit 1 }

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build standalone EXE
        run: pnpm tauri build --target i686-pc-windows-msvc --no-bundle
        env:
          CI: true

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: inzi-cnc-gauge-windows-x86
          path: src-tauri/target/i686-pc-windows-msvc/release/inzi_cnc_gauge.exe
          if-no-files-found: error
